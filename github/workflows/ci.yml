name: Run Tests on Pull Request

on:
  pull_request:
    branches: [ main, master, Day1 ]
  schedule:
    - cron: '30 1 * * *' # 7:00 AM IST (UTC+5:30)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Maven tests
        run: mvn clean test